name: Expo Preview — PR

on:
  pull_request:
    branches: [main]

env:
  EXPO_PUBLIC_GOLDAPI_KEY: ${{ secrets.EXPO_PUBLIC_GOLDAPI_KEY }}
  EXPO_PUBLIC_INR_KEY: ${{ secrets.EXPO_PUBLIC_INR_KEY }}

jobs:
  preview:
    name: Expo Preview Update
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Publish preview update
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --branch preview
